name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Download modules
        run: go mod download

      - name: Run tests
        run: go test -v -race ./...

      - name: Build
        run: go build ./...

      - name: Generate release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "# Release ${TAG}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## What's Changed" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          # Extract changelog section for this version
          awk '/^## \['"${TAG#v}"'\]/{flag=1;next}/^## \[/{flag=0}flag' CHANGELOG.md >> RELEASE_NOTES.md || true
          echo "" >> RELEASE_NOTES.md
          echo "## Install" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo '```bash' >> RELEASE_NOTES.md
          echo "go get github.com/jonathan-chery/coreci-workflows@${TAG}" >> RELEASE_NOTES.md
          echo '```' >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
